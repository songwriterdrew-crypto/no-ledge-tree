<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="Favicon.png">
  <title>No-Ledge Tree</title>
  <style>
    :root {
        --bg: #030303;
        --card: #050505;
        --accent: #00ff00; 
        --accent-alt: #ff0000; 
        --text: #e0e0e0;
        --text-muted: #555;
        --transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    body { 
        background: var(--bg);
        color: var(--text); 
        font-family: "EB Garamond", serif; 
        text-align: center; 
        margin: 0; 
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 1.5rem;
        box-sizing: border-box;
    }

    main {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        align-items: center;
        width: 100%;
        padding-top: 2rem;
        overflow-y: auto;
    }

    .tree-container { 
        margin: 0 auto 1.5rem auto; 
        width: 120px; 
        height: 150px; 
        display: flex;
        align-items: center;
    }
    .logo-tree { width: 100%; height: auto; stroke: #333; }

    h1 { font-size: 1.2rem; font-weight: 300; letter-spacing: 0.6rem; margin: 0 0 0.5rem 0; text-transform: uppercase; }
    
    .tagline { color: var(--text-muted); letter-spacing: 0.4rem; font-size: 0.5rem; margin: 0; text-transform: uppercase; }

    .mantra { 
        color: var(--text-muted); font-style: italic; font-size: 0.9rem; 
        margin: 2rem auto; max-width: 350px; line-height: 1.8; opacity: 0.7;
    }
    
    #prompt-display { font-style: italic; color: var(--text-muted); margin: 0 auto 2rem auto; min-height: 3rem; max-width: 450px; line-height: 1.6; font-size: 1rem; }
    
    #seed-input { 
        background: transparent; border: none; border-bottom: 1px solid #222;
        color: #888; width: 100%; max-width: 300px; padding: 1rem; text-align: center; font-size: 1rem; 
        font-family: "EB Garamond", serif; outline: none; transition: var(--transition);
    }
    #seed-input:focus { border-color: var(--accent); color: var(--text); }

    button { 
        background: transparent; border: 1px solid #222; color: var(--text-muted); 
        padding: 0.6rem 2rem; margin-top: 2rem; cursor: pointer;
        transition: var(--transition); text-transform: uppercase; letter-spacing: 0.2rem; font-size: 0.5rem;
    }
    button:hover { border-color: var(--accent); color: var(--accent); }
    
    #grove-status { color: #333; font-size: 0.5rem; margin-top: 5rem; letter-spacing: 0.3rem; text-transform: uppercase; }
    #grove-status a { color: #333; text-decoration: none; transition: var(--transition); }
    #grove-status a:hover { color: var(--accent); }

    nav { display: flex; gap: 2.5rem; justify-content: center; margin-top: 3rem; margin-bottom: 2rem; }
    nav a { color: var(--text-muted); text-decoration: none; font-size: 0.5rem; text-transform: uppercase; letter-spacing: 0.3rem; transition: var(--transition); cursor: pointer; }
    nav a:hover { color: var(--accent); }
    
    #toast {
        position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
        background: #111; border: 1px solid #222; padding: 0.8rem 1.5rem;
        color: #fff; font-size: 0.6rem; opacity: 0; pointer-events: none;
        transition: var(--transition); z-index: 3000; letter-spacing: 0.1rem; text-transform: uppercase;
    }
    #toast.show { opacity: 1; }

    .lightbox { 
        position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
        background: rgba(0,0,0,0.95); backdrop-filter: blur(15px); 
        z-index: 2000; display: flex; justify-content: center; align-items: center; 
        opacity: 0; pointer-events: none; transform: scale(0.98);
        transition: var(--transition); 
    }
    .lightbox.show { opacity: 1; pointer-events: auto; transform: scale(1); }
    
    .lightbox-content { text-align: center; width: 85%; max-width: 350px; }
    .lightbox-content h2 { color: #555; font-size: 0.5rem; margin-bottom: 3rem; text-transform: uppercase; letter-spacing: 0.3rem; font-weight: 300; }
    
    textarea { 
        width: 100%; background: transparent; border: none; border-bottom: 1px solid #222; 
        color: #fff; padding: 1rem 0; font-family: "EB Garamond", serif; font-size: 1rem; 
        text-align: center; outline: none; resize: none; transition: var(--transition);
    }
    textarea:focus { border-bottom: 1px solid #555; }
    
    .lightbox-close { margin-top: 3rem; cursor: pointer; color: #333; font-size: 0.5rem; letter-spacing: 0.2rem; text-transform: uppercase; transition: var(--transition); }
    .lightbox-close:hover { color: var(--text-muted); }

    @keyframes breathe { 0%, 100% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.15); opacity: 1; } }
    @keyframes fall { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(100px); opacity: 0; } }
    .fruit-node { transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); transform-origin: center; animation: breathe 6s ease-in-out infinite; }
    .fruit-node.show { transform: scale(1); }
    .fruit-node.fall { animation: fall 1.5s ease-in-out forwards; }
  </style>
</head>
<body>
  <div id="toast"></div>

  <main>
      <div class="tree-container">
        <svg id="tree-svg" viewBox="0 0 100 150" class="logo-tree">
          <path d="M50 150 L50 90 M50 90 L30 60 M50 90 L70 60 M50 90 L50 50" stroke="currentColor" stroke-width="2" fill="none" />
          <g id="fruit-container"></g>
        </svg>
      </div>

      <h1>NO-LEDGE-TREE</h1>
      <p class="tagline">A SPACE FOR UNLEARNING</p>
      
      <div class="mantra">To unlearn is not to lose. It is to make space for what is true.</div>
      
      <div id="prompt-display">Loading reflection...</div>
      <input type="text" id="seed-input" placeholder="What are you unlearning?">
      <button id="plant-btn">Sow</button>
      
      <p id="grove-status"><a href="harvest.html">The Grove holds 0 seeds.</a></p>
  </main>

  <nav>
    <a href="about.html">About</a> 
    <a href="harvest.html">Harvest</a> 
    <a href="rules.html">Rules</a> 
    <a id="feedback-trigger">Contribute</a>
  </nav>

  <div class="lightbox" id="feedback-lightbox">
      <div class="lightbox-content">
          <h2>Offering</h2>
          <textarea id="feedback-input" rows="3" maxlength="300" placeholder="How might this grove grow?"></textarea>
          <button onclick="submitFeedback()" style="margin-top: 2rem;">Send</button>
          <div class="lightbox-close" onclick="closeFeedback()">Return</div>
      </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp, getDocs, query, orderBy, limit, getCountFromServer } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyCNtb9aKUOLjJXH59mDnD6IQMYIxpAT3ss", authDomain: "no-ledge-tree.firebaseapp.com", projectId: "no-ledge-tree", storageBucket: "no-ledge-tree.firebasestorage.app", messagingSenderId: "633687715329", appId: "1:633687715329:web:c18aa11ccb64b7d43fda00" };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const toast = document.getElementById('toast');
    window.showToast = (msg) => { toast.innerText = msg; toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 2000); };

    document.getElementById('feedback-trigger').addEventListener('click', () => document.getElementById('feedback-lightbox').classList.add('show'));
    window.closeFeedback = () => document.getElementById('feedback-lightbox').classList.remove('show');
    
    window.submitFeedback = async () => {
        const input = document.getElementById('feedback-input');
        if(!input.value) return;
        try {
            await addDoc(collection(db, "feedback"), { text: input.value, timestamp: serverTimestamp() });
            showToast("Received.");
            input.value = "";
            closeFeedback();
        } catch (e) { showToast("Error."); }
    };

    const prompts = ["What is a belief you are ready to let go of?", "What did you unlearn today?", "What space are you making for new growth?", "If you knew nothing, what would you choose to believe?", "What truth have you outgrown?"];
    document.getElementById('prompt-display').innerText = prompts[Math.floor(Math.random() * prompts.length)];

    async function updateStatus() {
        try {
            const snap = await getCountFromServer(collection(db, "thoughts"));
            const count = snap.data().count;
            document.getElementById('grove-status').innerHTML = `<a href="harvest.html">The Grove holds ${count} seeds.</a>`;
        } catch (e) { console.error("Error updating status:", e); }
    }

    const branchNodes = [[30, 60], [70, 60], [50, 50], [40, 75], [60, 75], [35, 80], [65, 80], [45, 65], [55, 65]];
    async function growFruit() {
      const container = document.getElementById('fruit-container');
      container.innerHTML = ""; 
      const q = query(collection(db, "thoughts"), orderBy("timestamp", "desc"), limit(branchNodes.length));
      const snap = await getDocs(q);
      let i = 0;
      snap.forEach(() => {
        const fruit = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        const [cx, cy] = branchNodes[i % branchNodes.length];
        const fruitColor = i % 2 === 0 ? "var(--accent)" : "var(--accent-alt)";
        fruit.setAttribute("cx", cx); fruit.setAttribute("cy", cy); fruit.setAttribute("r", "3.5"); 
        fruit.setAttribute("fill", fruitColor); fruit.setAttribute("class", "fruit-node");
        container.appendChild(fruit);
        setTimeout(() => fruit.classList.add("show"), i * 100);
        i++;
      });
    }

    document.getElementById('plant-btn').addEventListener('click', async () => {
      const val = document.getElementById('seed-input').value;
      if (!val) return;
      try {
        await addDoc(collection(db, "thoughts"), { thought: val, timestamp: serverTimestamp(), type: "thought", reflectionCount: 0 });
        document.getElementById('seed-input').value = "";
        growFruit();
        updateStatus();
        showToast("Seed sown.");
      } catch (e) { showToast("Unable to sow."); }
    });

    growFruit();
    updateStatus();
  </script>
</body>
</html>
