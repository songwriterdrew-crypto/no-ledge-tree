<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harvest | No-Ledge Tree</title>
    <style>
        :root {
            --bg: #030303; 
            --card: #080808; 
            --text-main: #f0f0f0; 
            --text-muted: #555; 
            --accent: #fff; 
            --seed-green: #689f68;
            --echo-blue: #5b8fb9;
            --dissolve-red: #b95b5b;
            --ease: cubic-bezier(0.16, 1, 0.3, 1);
        }

        body { 
            background: var(--bg); color: var(--text-main); 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            margin: 0; padding: 6rem 1.5rem; 
            display: flex; flex-direction: column; align-items: center; 
            -webkit-font-smoothing: antialiased;
        }

        .container { max-width: 440px; width: 100%; }
        
        h1 { font-weight: 200; font-size: 2rem; letter-spacing: 0.8rem; color: var(--accent); margin-bottom: 0.5rem; text-align: center; text-transform: uppercase; }
        .subtitle { font-size: 0.55rem; color: var(--seed-green); letter-spacing: 0.4rem; margin-bottom: 5rem; text-align: center; text-transform: uppercase; opacity: 0.7; }

        .thought-card { padding: 3rem 0; border-bottom: 1px solid #111; }
        
        .seed-header { display: flex; align-items: center; gap: 10px; margin-bottom: 1.5rem; }
        .seed-dot { width: 4px; height: 4px; background: var(--seed-green); border-radius: 50%; box-shadow: 0 0 8px var(--seed-green); }
        .seed-count-text { font-size: 0.6rem; color: var(--seed-green); letter-spacing: 0.2rem; text-transform: uppercase; }

        .text { font-size: 1.25rem; line-height: 1.6; margin-bottom: 2rem; letter-spacing: -0.01em; font-weight: 300; }
        
        .action-row { display: flex; gap: 2rem; align-items: center; }
        .btn { background: transparent; border: none; color: var(--text-muted); padding: 0; cursor: pointer; transition: all 0.4s var(--ease); font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.15rem; }
        .btn:hover { color: var(--accent); }
        .btn:disabled { opacity: 0.3; cursor: not-allowed; }
        
        .btn-view { border: 1px solid #222; color: var(--text-main); padding: 6px 12px; border-radius: 2px; }
        .btn-view:hover { border-color: var(--seed-green); color: var(--seed-green); }
        
        .accordion { display: none; padding-top: 2rem; margin-top: 1rem; border-top: 1px solid #111; animation: fadeIn 0.4s var(--ease); }
        .accordion.open { display: block; }
        
        .echo-item { padding: 16px; margin-bottom: 10px; font-size: 0.8rem; line-height: 1.4; border-left: 1px solid #333; background: #0c0c0c; }
        .echo-reflection { border-left-color: var(--echo-blue); color: var(--echo-blue); }
        .echo-challenge { border-left-color: var(--dissolve-red); color: var(--dissolve-red); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        #toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #111; padding: 0.8rem 1.5rem; color: #fff; font-size: 0.65rem; opacity: 0; pointer-events: none; transition: 0.5s var(--ease); border: 1px solid #222; letter-spacing: 0.1rem; text-transform: uppercase; }
        #toast.show { opacity: 1; }
        
        .lightbox { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(8px); z-index: 100; justify-content: center; align-items: center; }
        .lightbox.show { display: flex; }
        .lightbox-content { background: #080808; border: 1px solid #222; padding: 2.5rem; width: 80%; max-width: 350px; border-radius: 2px; }
        .lightbox-content input { width: 100%; background: transparent; border: none; border-bottom: 1px solid #333; color: #fff; padding: 0.5rem 0; font-size: 1rem; outline: none; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <div id="toast"></div>
    <div class="container">
        <h1>HARVEST</h1>
        <p class="subtitle">The Grove</p>
        <div id="feed">Cultivating...</div>
        <nav style="margin-top: 4rem;"><a href="index.html" style="color:var(--text-muted); text-decoration:none; font-size:0.6rem; letter-spacing:0.2rem; text-transform:uppercase;">← Return</a></nav>
    </div>

    <div class="lightbox" id="lightbox">
        <div class="lightbox-content">
            <h2 id="modal-title" style="font-size: 0.7rem; color: #666; margin-bottom: 2rem; letter-spacing: 0.1rem; text-transform: uppercase;">Action</h2>
            <input type="text" id="lightbox-input" maxlength="120" placeholder="...">
            <button id="sow-btn" class="btn" style="width: 100%; color: #fff; padding: 0.5rem; border: 1px solid #333;" onclick="submitLightboxReply()">Sow</button>
            <div class="btn" style="margin-top: 1rem; text-align: center; width: 100%; cursor: pointer;" onclick="closeLightbox()">Close</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, serverTimestamp, query, orderBy, where, doc, writeBatch, increment, limit } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyCNtb9aKUOLjJXH59mDnD6IQMYIxpAT3ss", authDomain: "no-ledge-tree.firebaseapp.com", projectId: "no-ledge-tree", storageBucket: "no-ledge-tree.firebasestorage.app", messagingSenderId: "633687715329", appId: "1:633687715329:web:c18aa11ccb64b7d43fda00" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let activethoughtId = null;
        let activeMode = null;

        window.showToast = (msg) => {
            const toast = document.getElementById('toast');
            toast.innerText = msg; toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        };

        async function loadHarvest() {
            try {
                const q = query(collection(db, "thoughts"), orderBy("timestamp", "desc"), limit(10));
                const snap = await getDocs(q);
                const feed = document.getElementById('feed');
                feed.innerHTML = "";
                
                snap.forEach(doc => {
                    const data = doc.data();
                    const id = doc.id;
                    const seedCount = data.reflectionCount || 0;
                    
                    const div = document.createElement('div');
                    div.className = 'thought-card';
                    div.innerHTML = `
                        <div class="seed-header">
                            <div class="seed-dot"></div>
                            <span class="seed-count-text" id="count-${id}">${seedCount} ${seedCount === 1 ? 'seed' : 'seeds'}</span>
                        </div>
                        <div class="text">${data.thought}</div>
                        <div class="action-row">
                            <button class="btn btn-view" onclick="toggleAccordion('${id}')">View Seed</button>
                            <button class="btn" onclick="openLightbox('${id}', 'Echo')">Echo</button>
                            <button class="btn" onclick="openLightbox('${id}', 'Dissolve')">Dissolve</button>
                        </div>
                        <div id="acc-${id}" class="accordion"></div>
                    `;
                    feed.appendChild(div);
                });
            } catch (e) { feed.innerText = "The grove is resting."; }
        }

        window.toggleAccordion = async (id) => {
            const acc = document.getElementById(`acc-${id}`);
            if (acc.classList.contains('open')) { acc.classList.remove('open'); return; }
            acc.classList.add('open');
            if (acc.innerHTML !== "") return; 
            
            acc.innerHTML = "<div style='color:#333; font-size:0.7rem;'>Loading...</div>";
            const q = query(collection(db, "reflections"), where("thoughtId", "==", id), orderBy("timestamp", "desc"));
            const snap = await getDocs(q);
            
            acc.innerHTML = snap.empty ? "<p style='color:#333; font-size:0.7rem;'>No seeds yet.</p>" : "";
            snap.forEach(d => {
                const data = d.data();
                const type = data.type || 'reflection';
                const colorClass = type === 'challenge' ? 'echo-challenge' : 'echo-reflection';
                acc.innerHTML += `<div class="echo-item ${colorClass}">${data.text}</div>`;
            });
        };

        window.openLightbox = (id, mode) => {
            activethoughtId = id; activeMode = mode;
            document.getElementById('modal-title').innerText = mode === 'Echo' ? "Hold a Mirror" : "Dissolve the Ledge";
            document.getElementById('lightbox').classList.add('show'); 
        };

        window.closeLightbox = () => document.getElementById('lightbox').classList.remove('show');

        window.submitLightboxReply = async () => {
            const input = document.getElementById('lightbox-input');
            const submitBtn = document.getElementById('sow-btn');
            
            if(!input.value) return;

            // Prevent double-clicks
            submitBtn.disabled = true;
            submitBtn.innerText = "Sowing...";
            
            const countEl = document.getElementById(`count-${activethoughtId}`);
            let current = parseInt(countEl.innerText);
            countEl.innerText = `${current + 1} ${current + 1 === 1 ? 'seed' : 'seeds'}`;

            const acc = document.getElementById(`acc-${activethoughtId}`);
            if(acc.classList.contains('open')) {
                const item = document.createElement('div');
                item.className = `echo-item ${activeMode === 'Dissolve' ? 'echo-challenge' : 'echo-reflection'}`;
                item.innerText = input.value;
                acc.prepend(item);
            }

            try {
                const batch = writeBatch(db);
                const ref = doc(collection(db, "reflections"));
                batch.set(ref, { 
                    thoughtId: activethoughtId, text: input.value, 
                    timestamp: serverTimestamp(), type: activeMode === 'Dissolve' ? 'challenge' : 'reflection'
                });
                batch.update(doc(db, "thoughts", activethoughtId), { reflectionCount: increment(1) });
                await batch.commit();
                showToast("Sown."); 
                input.value = ""; 
                closeLightbox();
            } catch(e) { 
                showToast("Error. Syncing..."); 
                loadHarvest(); 
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Sow";
            }
        };

        loadHarvest();
    </script>
</body>
</html>
