<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/png" href="Favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
    <title>Harvest | No-Ledge Tree</title>
    <style>
        :root {
            --bg: #000000;         
            --bg-grey: #121212;    
            --text-main: #e0e0e0; 
            --text-muted: #888; 
            --accent: #fff; 
            --seed-green: #689f68;
            --echo-blue: #6a8ca8; 
            --dissolve-red: #a86a6a; 
            --ease: cubic-bezier(0.4, 0, 0.2, 1);
        }

        body { 
            background: radial-gradient(circle at 50% 50%, var(--bg-grey), var(--bg));
            color: var(--text-main); 
            font-family: "Georgia", serif;
            margin: 0; padding: 6rem 1.5rem; 
            display: flex; flex-direction: column; align-items: center; 
            min-height: 100dvh;
        }

        .container { max-width: 400px; width: 100%; z-index: 1; }
        h1 { font-weight: 300; font-size: 2.5rem; letter-spacing: 0.8rem; color: var(--accent); margin-bottom: 0.5rem; text-align: center; text-transform: uppercase; }
        .subtitle { font-size: 0.5rem; color: var(--seed-green); letter-spacing: 0.5rem; margin-bottom: 4rem; text-align: center; text-transform: uppercase; opacity: 0.6; }
        .mantra { color: var(--text-muted); font-style: italic; font-size: 0.8rem; margin-bottom: 5rem; text-align: center; line-height: 1.8; opacity: 0.7; }
        .thought-card { padding: 4rem 0; border-bottom: 1px solid #111; }
        .seed-header { display: flex; align-items: center; gap: 12px; margin-bottom: 1.5rem; }
        .seed-dot { width: 6px; height: 6px; background: var(--seed-green); border-radius: 50%; }
        .seed-count-text { font-size: 0.7rem; color: var(--seed-green); letter-spacing: 0.3rem; text-transform: uppercase; }
        .seed-number { color: #fff; font-weight: 500; }
        .text { font-family: 'Playfair Display', serif; font-size: 1.5rem; line-height: 1.6; margin-bottom: 2rem; font-weight: 400; color: #ccc; letter-spacing: 0.01rem; }
        .action-row { display: flex; gap: 2rem; align-items: center; }
        .btn { background: transparent; border: 1px solid #222; color: var(--text-muted); padding: 0.4rem 1rem; cursor: pointer; transition: all 0.8s var(--ease); font-size: 0.5rem; text-transform: uppercase; letter-spacing: 0.2rem; }
        .btn:hover { border-color: var(--seed-green); color: var(--seed-green); }
        .btn-view { border-color: var(--seed-green); color: var(--seed-green); animation: pulse-view 3s infinite ease-in-out; }
        @keyframes pulse-view { 0%, 100% { opacity: 0.7; transform: scale(1); } 50% { opacity: 1; transform: scale(1.02); } }
        .accordion { max-height: 0; overflow: hidden; transition: max-height 0.8s var(--ease); border-top: 0px solid #111; }
        .accordion.open { max-height: 1000px; padding-top: 2rem; margin-top: 1rem; border-top: 1px solid #1a1a1a; }
        .echo-item { padding: 16px; margin-bottom: 12px; font-size: 0.85rem; line-height: 1.6; border-left: 2px solid; background: #060606; font-style: italic; }
        .echo-reflection { border-left-color: var(--echo-blue); color: var(--echo-blue); }
        .echo-challenge { border-left-color: var(--dissolve-red); color: var(--dissolve-red); }
        #toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #111; padding: 0.8rem 1.5rem; color: #fff; font-size: 0.6rem; opacity: 0; pointer-events: none; transition: 0.8s var(--ease); border: 1px solid #222; letter-spacing: 0.1rem; text-transform: uppercase; z-index: 3000; }
        #toast.show { opacity: 1; }
        .lightbox { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); backdrop-filter: blur(15px); z-index: 2000; display: none; justify-content: center; align-items: center; opacity: 0; transform: scale(0.98); transition: var(--ease); }
        .lightbox.show { display: flex; opacity: 1; transform: scale(1); }
        .lightbox-content { text-align: center; width: 85%; max-width: 350px; }
        .lightbox-content h2 { color: #555; font-size: 0.5rem; margin-bottom: 3rem; text-transform: uppercase; letter-spacing: 0.3rem; font-weight: 300; }
        #lightbox-input { width: 100%; background: transparent; border: none; border-bottom: 1px solid #222; color: #fff; padding: 1rem 0; font-family: "Georgia", serif; font-size: 1rem; text-align: center; outline: none; margin-bottom: 2rem; transition: var(--ease); }
        #lightbox-input:focus { border-bottom: 1px solid #555; }
        .lightbox-close { margin-top: 3rem; cursor: pointer; color: #333; font-size: 0.5rem; letter-spacing: 0.2rem; text-transform: uppercase; transition: var(--ease); }
        .lightbox-close:hover { color: var(--text-muted); }
    </style>
</head>
<body>
    <div id="toast"></div>

    <div class="container">
        <h1>HARVEST</h1>
        <p class="subtitle">The Grove</p>
        <div class="mantra">To unlearn is not to lose. It is to make space for what is true.</div>

        <div id="feed">Cultivating...</div>
        
        <nav style="margin-top: 5rem; text-align: center; margin-bottom: 4rem;">
            <a href="index.html" style="color:var(--text-muted); text-decoration:none; font-size:0.5rem; letter-spacing:0.3rem; text-transform:uppercase;">← Return to Tree</a>
        </nav>
    </div>

    <div class="lightbox" id="lightbox">
        <div class="lightbox-content">
            <h2 id="modal-title">Action</h2>
            <input type="text" id="lightbox-input" maxlength="120" placeholder="...">
            <button id="sow-btn" class="btn" style="width: 100%; color: var(--text-muted);">Sow</button>
            <div class="lightbox-close" id="close-lightbox-btn">Return</div>
        </div>
    </div>

    <script type="module" src="js/harvest.js"></script>
</body>
</html>
